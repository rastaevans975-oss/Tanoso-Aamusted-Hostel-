<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanoso AAMUSTED Hostel Portal</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        h1 { color: #2c3e50; }
        p { color: #555; }
    </style>
</head>
<body>
    <h1>Welcome to Tanoso AAMUSTED Hostel Portal</h1>
    <div class="rooms-container">
        <div class="form-container">
            <h2>Book Your Room</h2>
            <form action="https://formspree.io/f/mqpzkwde" method="POST">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        
                <label for="roomType">Select Room Type:</label>
                <select id="roomType" name="roomType">
                    <option value="Single Room">Single Room - GH₵ 1,200</option>
                    <option value="1-In-A-Room / Executive">1-In-A-Room / Executive - GH₵ 2,000</option>
                    <option value="2-In-A-Room (Shared)">2-In-A-Room (Shared) - GH₵ 800</option>
                </select>
        
                <button type="submit">Submit Application</button>
            </form>
        </div>
                
    
</body>
</html>
